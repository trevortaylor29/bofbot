# Manual macOS desktop build (DMG). Does not publish to GitHub Releases.
# After a Windows release, run this workflow and attach the artifact to the release if needed.
name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-worker.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install PyInstaller and worker dependencies
        run: pip install pyinstaller -r requirements-worker.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build renderer and worker pipeline
        working-directory: desktop
        run: npm run build:renderer && npm run build:pipeline

      - name: Debug worker bundle layout
        run: |
          echo '--- Worker directory ---'
          ls -la desktop/build/pipeline-staging/worker/ || true
          echo '--- Worker _internal contents (onedir only) ---'
          if [ -d desktop/build/pipeline-staging/worker/_internal ]; then
            ls -la desktop/build/pipeline-staging/worker/_internal/ | head -30
            find desktop/build/pipeline-staging/worker/_internal/ \( -name 'Python' -o -name 'Python.framework' -o -name 'libpython*' \) 2>/dev/null || true
          else
            echo '(no _internal — e.g. macOS onefile: single binary in worker/)'
            file desktop/build/pipeline-staging/worker/bofbot-worker 2>/dev/null || true
          fi

      # PyInstaller embeds Python.framework with loose root files that break codesign sealing.
      - name: Fix PyInstaller Python.framework for macOS codesign
        run: |
          FRAMEWORK_DIR=$(find desktop/build/pipeline-staging -name 'Python.framework' -type d | head -1)
          if [ -d "$FRAMEWORK_DIR" ]; then
            find "$FRAMEWORK_DIR" -maxdepth 1 -type f -delete
            find "$FRAMEWORK_DIR" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          fi

      - name: Build Mac DMG (no Apple code signing)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
        run: npx electron-builder --mac --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: BofBot-Mac-DMG
          path: desktop/release/*.dmg
          if-no-files-found: error

      - name: Upload latest-mac.yml (auto-update)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: BofBot-Mac-latest-mac-yml
          path: desktop/release/latest-mac.yml
          if-no-files-found: warn
